<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dan Laws</title>
    <meta name="description" content="Dan Laws. New site coming soon." />
    <!-- Placeholder page: keep it out of search results until the real site launches. -->
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#f5f3ee" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111210" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      :root {
        --bg: #f5f3ee;
        --ink: #1b1a17;
        --muted: #6e6a61;
        --line: #dcd8cf;
        --accent: #2f6f5e;
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #111210;
          --ink: #ecebe6;
          --muted: #9d9b93;
          --line: #2a2c28;
          --accent: #6cc3a4;
          color-scheme: dark;
        }
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
        display: grid;
        grid-template-rows: 1fr auto;
        min-height: 100dvh;
      }
      main {
        display: grid;
        align-content: center;
        gap: 1.5rem;
        width: min(40rem, 100% - 2rem);
        margin-inline: auto;
        padding-block: 4rem;
      }
      h1 {
        margin: 0;
        font-family: ui-serif, "New York", Georgia, "Times New Roman", serif;
        font-weight: 500;
        font-size: clamp(3rem, 12vw, 5.5rem);
        line-height: 0.95;
        letter-spacing: -0.03em;
      }
      .status {
        display: inline-flex;
        align-items: center;
        gap: 0.6rem;
        margin: 0;
        font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        font-size: 0.875rem;
        color: var(--muted);
      }
      .dot {
        width: 0.5rem;
        height: 0.5rem;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 60%, transparent);
        animation: pulse 2.4s ease-out infinite;
      }
      @keyframes pulse {
        0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 50%, transparent); }
        70%, 100% { box-shadow: 0 0 0 0.6rem transparent; }
      }
      @media (prefers-reduced-motion: reduce) {
        .dot { animation: none; }
      }
      p.lede {
        margin: 0;
        max-width: 30rem;
        font-size: 1.125rem;
        line-height: 1.6;
        color: var(--muted);
      }
      nav { display: flex; flex-wrap: wrap; gap: 0.75rem; }
      nav a {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.55rem 0.9rem;
        border: 1px solid var(--line);
        border-radius: 999px;
        color: var(--ink);
        text-decoration: none;
        font-size: 0.9375rem;
        transition: border-color 0.15s, color 0.15s;
      }
      nav a:hover, nav a:focus-visible { border-color: var(--accent); color: var(--accent); }
      nav a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      nav svg { width: 1rem; height: 1rem; fill: currentColor; }
      footer {
        width: min(40rem, 100% - 2rem);
        margin-inline: auto;
        padding-block: 1.5rem;
        border-top: 1px solid var(--line);
        font-size: 0.8125rem;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main>
      <p class="status"><span class="dot" aria-hidden="true"></span>New site in progress</p>
      <h1>Dan Laws</h1>
      <p class="lede">I'm putting together a home for my work and projects. Check back soon.</p>
      <nav aria-label="Elsewhere">
        <a href="https://github.com/DanLaws" rel="me noopener">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0a8 8 0 0 0-2.53 15.59c.4.07.55-.17.55-.38v-1.33c-2.23.48-2.7-1.07-2.7-1.07-.36-.92-.89-1.17-.89-1.17-.73-.5.05-.49.05-.49.8.06 1.23.83 1.23.83.72 1.22 1.88.87 2.34.67.07-.52.28-.87.5-1.07-1.78-.2-3.65-.89-3.65-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.6 7.6 0 0 1 4 0c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.28.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48v2.2c0 .21.15.46.55.38A8 8 0 0 0 8 0Z"/></svg>
          GitHub
        </a>
      </nav>
    </main>
    <footer>© <span id="year">2026</span> Dan Laws</footer>
    <script>document.getElementById("year").textContent = new Date().getFullYear();</script>
  </body>
</html>
